<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JS Studio Logo 3D PRO</title><style>*{box-sizing:border-box}body{margin:0;background:#101726;color:#fff;font:14px Arial}header{padding:10px;background:#18233a;font-weight:bold;color:#7bd8ff}main{display:flex;height:calc(100vh - 44px);gap:10px;padding:10px}aside{width:250px;overflow:auto}button,input,select{margin:3px;padding:9px;border:0;border-radius:7px}button{background:#2676e6;color:white}button:active{background:#51a7ff}input,select{max-width:95%}canvas{height:100%;max-width:100%;aspect-ratio:16/9;background:#090d17;touch-action:none;border:2px solid #385078}section{flex:1;display:flex;justify-content:center;align-items:center;min-width:0}label{display:block;margin-top:6px}</style></head><body><header>JS STUDIO LOGO 3D PRO — Editor de logotipos</header><main><aside><button onclick="addText()">+ Texto</button><button onclick="addSphere()">+ Esfera</button><button onclick="remove()">Excluir</button><label>Texto selecionado</label><input id="txt" placeholder="Digite o texto" oninput="rename()"><label>Cor</label><input id="color" type="color" value="#33bbff" oninput="recolor()"><label>Tamanho</label><input id="size" type="range" min="20" max="220" value="80" oninput="resize()"><hr><strong>ANIMAÇÃO DA CAMADA</strong><label>Efeito</label><select id="effect" onchange="setEffect()"><option value="none">Sem animação</option><option value="spin">Girar 360°</option><option value="pulse">Pulsar</option><option value="float">Flutuar</option><option value="slide">Deslizar</option><option value="zoom">Zoom de entrada</option><option value="fade">Aparecer</option><option value="bounce">Saltar</option></select><label>Velocidade (segundos por ciclo)</label><input id="speed" type="range" min="1" max="12" step="0.5" value="3" oninput="setSpeed()"><label>Tempo da animação (segundos)</label><input id="duration" type="number" min="1" max="120" value="8" onchange="setDuration()"><div><button onclick="play()">▶ Reproduzir</button><button onclick="pause()">⏸ Pausar</button><button onclick="restart()">↺ Reiniciar</button></div><button onclick="save()">Salvar projeto</button><button onclick="load()">Abrir projeto</button><button onclick="exportPng()">Exportar PNG</button><p>Toque para selecionar. Arraste para mover. Efeitos de esfera estilizada.</p></aside><section><canvas id="c" width="1280" height="720"></canvas></section></main><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let playing=false,elapsed=0,lastFrame=0,duration=8;let items=[{type:'text',text:'JS STUDIO',x:640,y:380,size:100,color:'#33bbff'}],sel=0,drag=false;
function draw(){ctx.fillStyle='#080d19';ctx.fillRect(0,0,1280,720);ctx.fillStyle='#142038';ctx.fillRect(30,30,1220,660);items.forEach((o,i)=>{ctx.save();let phase=elapsed*2*Math.PI/(o.speed||3),eff=o.effect||'none',x=o.x,y=o.y,scale=1,rotation=0;if(eff==='spin')rotation=phase;if(eff==='pulse')scale=1+0.22*Math.sin(phase);if(eff==='float')y+=45*Math.sin(phase);if(eff==='slide')x+=100*Math.sin(phase);if(eff==='bounce')y-=Math.abs(80*Math.sin(phase));if(eff==='zoom')scale=0.15+0.85*Math.min(1,elapsed/(o.speed||3));if(eff==='fade')ctx.globalAlpha=Math.max(0.05,Math.min(1,elapsed/(o.speed||3)));ctx.translate(x,y);ctx.rotate(rotation);ctx.scale(scale,scale);ctx.translate(-x,-y);if(o.type==='text'){ctx.font='bold '+o.size+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=o.color;ctx.shadowBlur=25;ctx.fillStyle=o.color;ctx.fillText(o.text,o.x,o.y);ctx.shadowBlur=0}else{let r=o.size,g=ctx.createRadialGradient(o.x-r*.35,o.y-r*.4,3,o.x,o.y,r);g.addColorStop(0,'#ffffff');g.addColorStop(.18,o.color);g.addColorStop(1,'#020714');ctx.fillStyle=g;ctx.beginPath();ctx.arc(o.x,o.y,r,0,Math.PI*2);ctx.fill()}if(i===sel){ctx.strokeStyle='#fff9';ctx.setLineDash([9,7]);ctx.strokeRect(o.x-o.size*1.6,o.y-o.size*1.2,o.size*3.2,o.size*2.4);ctx.setLineDash([])}ctx.restore()})}
function addText(){items.push({type:'text',text:'NOVO LOGO',x:640,y:360,size:80,color:document.getElementById('color').value});sel=items.length-1;sync();draw()}
function addSphere(){items.push({type:'sphere',x:640,y:350,size:110,color:document.getElementById('color').value});sel=items.length-1;sync();draw()}
function remove(){if(sel>=0)items.splice(sel,1);sel=items.length-1;sync();draw()}
function rename(){if(items[sel]?.type==='text'){items[sel].text=document.getElementById('txt').value;draw()}}
function recolor(){if(items[sel]){items[sel].color=document.getElementById('color').value;draw()}}
function resize(){if(items[sel]){items[sel].size=+document.getElementById('size').value;draw()}}
function sync(){let o=items[sel];document.getElementById('effect').value=o?.effect||'none';document.getElementById('speed').value=o?.speed||3;document.getElementById('txt').value=o?.text||'';document.getElementById('size').value=o?.size||80;document.getElementById('color').value=o?.color||'#33bbff'}
function pos(e){let b=c.getBoundingClientRect();return{x:(e.clientX-b.left)*1280/b.width,y:(e.clientY-b.top)*720/b.height}}
c.onpointerdown=e=>{let p=pos(e);for(let i=items.length-1;i>=0;i--){let o=items[i];if(Math.abs(o.x-p.x)<o.size*1.6&&Math.abs(o.y-p.y)<o.size*1.2){sel=i;break}}drag=true;c.setPointerCapture(e.pointerId);sync();draw()};
c.onpointermove=e=>{if(!drag||sel<0)return;let p=pos(e);items[sel].x=p.x;items[sel].y=p.y;draw()};c.onpointerup=()=>drag=false;
function setEffect(){if(items[sel]){items[sel].effect=document.getElementById('effect').value;elapsed=0;draw()}}
function setSpeed(){if(items[sel])items[sel].speed=+document.getElementById('speed').value}
function setDuration(){duration=Math.max(1,+document.getElementById('duration').value||8);elapsed=0;draw()}
function tick(now){if(!playing)return;if(lastFrame)elapsed+=(now-lastFrame)/1000;lastFrame=now;if(elapsed>=duration){elapsed=duration;playing=false}draw();if(playing)requestAnimationFrame(tick)}
function play(){if(playing)return;if(elapsed>=duration)elapsed=0;playing=true;lastFrame=0;requestAnimationFrame(tick)}
function pause(){playing=false;lastFrame=0}
function restart(){elapsed=0;lastFrame=0;draw();if(playing)requestAnimationFrame(tick)}
function save(){localStorage.setItem('jsstudio',JSON.stringify({items,duration}));alert('Projeto salvo neste aparelho')}
function load(){try{let x=JSON.parse(localStorage.getItem('jsstudio'));if(x){items=Array.isArray(x)?x:x.items;duration=x.duration||8;document.getElementById('duration').value=duration;sel=items.length-1;sync();draw()}}catch(e){alert('Erro ao abrir')}}
function exportPng(){Android.savePng(c.toDataURL('image/png'))}sync();draw();
</script></body></html>
